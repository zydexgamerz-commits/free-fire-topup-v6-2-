<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Top Up</title><link rel="stylesheet" href="/admin.css"></head><body>
<div id="login" class="login"><div class="panel"><div class="logo">🔥</div><h1>Admin Panel</h1><p>Manage products, orders and payment settings.</p><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden"><header><b>🔥 Store Admin</b><button onclick="logout()">Logout</button></header><main><nav><button class="nav active" data-page="orders">Orders</button><button class="nav" data-page="products">Products</button><button class="nav" data-page="settings">Payment / Settings</button></nav>
<section id="orders" class="page"><h1>Orders</h1><div id="ordersList"></div></section>
<section id="products" class="page hidden"><div class="top"><h1>Products</h1><button onclick="newProduct()">+ Add product</button></div><div id="productsList"></div></section>
<section id="settings" class="page hidden"><h1>Payment & Store Settings</h1><div class="form panel"><label>Store name<input id="sName"></label><label>Subtitle<input id="sSub"></label><label>UPI ID<input id="sUpi" placeholder="example@upi"></label><label>Payment QR image URL<input id="sQr" placeholder="https://.../qr.png"></label><label>Or upload QR image<input id="sQrFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><small>Uploaded images are stored on the Render persistent disk.</small><label>Support text<input id="sSupport"></label><button id="saveSettingsBtn" onclick="saveSettings()">Save settings</button><div id="saveMsg"></div></div></section>
</main></div><div id="editor" class="overlay hidden"><div class="panel"><button class="close" onclick="closeEditor()">×</button><h2 id="editTitle">Product</h2><input type="hidden" id="pId"><label>Name<input id="pName"></label><label>Category<select id="pMode"><option value="diamonds">Diamonds</option><option value="passes">Passes</option></select></label><label>Selling price<input id="pPrice" type="number" min="0"></label><label>Original price<input id="pMrp" type="number" min="0"></label><label>Bonus / description<input id="pBonus"></label><label>Stock<input id="pStock" type="number" min="0"></label><label>Badge<input id="pBadge" placeholder="HOT / BEST VALUE"></label><label>Image URL<input id="pImage"></label><label>Or upload product image<input id="pImageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label><input id="pActive" type="checkbox"> Active / visible</label><button id="saveProductBtn" onclick="saveProduct()">Save product</button><button class="danger" id="deleteBtn" onclick="deleteProduct()">Delete</button></div></div><script src="/admin.js"></script></body></html>
